name: coop-games

services:
  coop-games:
    image: ghcr.io/sspeaker/coop-games:latest
    container_name: coop-games
    restart: unless-stopped
    ports:
      - "8095:8080"
    volumes:
      - /DATA/AppData/coop-games:/data
    environment:
      TZ: Europe/Madrid
      # Hours between automatic database updates (0 = off)
      UPDATE_INTERVAL_HOURS: "168"
      # Import automatically when the database is empty
      UPDATE_ON_EMPTY_START: "1"
      LOG_LEVEL: INFO

x-casaos:
  architectures:
    - amd64
    - arm64
  main: coop-games
  author: sSpeaker
  developer: sSpeaker
  category: Entertainment
  icon: https://cdn.jsdelivr.net/gh/sSpeaker/coop-games@main/app/static/icon.svg
  title:
    en_us: Co-op Games
  tagline:
    en_us: Co-op game catalog for PC, PlayStation and Switch
  description:
    en_us: Co-op game catalog built from OpenCritic, Co-optimus and PEGI.
  index: /
  port_map: "8095"
  scheme: http
  repo: https://github.com/sSpeaker/coop-games
